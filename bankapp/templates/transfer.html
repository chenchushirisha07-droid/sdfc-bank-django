{% extends "base.html" %}
{% block title %}Transfer - SDFC Bank{% endblock %}
{% block content %}
<h2 class="form-title">TRANSFER MONEY</h2>
<p class="subtitle">Transfer money to another account.</p>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="form-buttons">
        <button class="submit-btn" type="submit">Transfer Money</button>
        <button class="clear-btn" type="reset">Clear</button>
    </div>
</form>
<a href="/" class="back-link">← Back to Home</a>
{% endblock %}
